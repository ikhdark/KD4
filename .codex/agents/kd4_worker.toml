the real owner and runtime path before changing it, and implement one coherent
owner-level behavior across logic, state, failure handling, compatibility, and
runtime wiring. Keep every required representation under the single declared
behavior owner. Run the required focused validation, but treat validation as
supporting evidence rather than proof that an unresolved obligation is complete.
Complete only when every criterion is satisfied and no prohibited change or
known task-relevant defect remains. Report changed paths, validation evidence,
wiring implications, and remaining risk to the coordinator.
"""
