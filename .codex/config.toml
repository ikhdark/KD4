approval_policy = "never"

sandbox_mode = "danger-full-access"
allow_login_shell = false

[features]
task_completion_reviewer = true

[agents]
max_depth = 1

[features.multi_agent_v2]
enabled = true
max_concurrent_threads_per_session = 3

[reasoning_phase_efforts]
orient = "xhigh"
inspect = "max"
implement = "max"
diagnose = "high"
verify = "medium"
finalize = "medium"
