approval_policy = "never"

sandbox_mode = "danger-full-access"
allow_login_shell = false

[features]
task_completion_reviewer = true

[agents]
max_depth = 1

[agents.kd4_explorer]
description = "Read-only KD4 contract architect for risky implementation work."
config_file = "./agents/kd4_explorer.toml"

[features.multi_agent_v2]
enabled = true
max_concurrent_threads_per_session = 3

[reasoning_phase_efforts]
orient = "high"
inspect = "high"
implement = "high"
diagnose = "high"
verify = "high"
finalize = "low"
