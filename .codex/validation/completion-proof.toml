schema_version = 2
policy_id = "kd4"
frozen_inventory_hash = "a2fb8c0b806853b6375d92cfa6daf985ea35a5c4d4ecd49cf1d6da6f23359152"
canonical_command = "just completion-proof"
focused_command = "just completion-focused {validation_id}"
