repository_root = "../.."
frozen_inventory = ".codex/validation/frozen-test-inventory-v1.json"
replacement_ledger = ".codex/validation/test-replacements-v1.json"
host_platform = "windows"

# Explicit preparatory evidence only; these existing validations still run
# again during canonical certification. This is not a required-validation bypass.
[focused_inventory_evidence]
validation_ids = ["maintenance.root-unittest", "sdk.python.pytest"]

# `just completion-focused inventory.transition-readiness` reuses the frozen
# reconciliation route below for admission preparation. Unresolved baselines
# and unadmitted current IDs remain blockers for full reconciliation and final
# certification. Readiness is never a canonical required validation.

# These tests require an independently installed Codex app-server and are
# deliberately quarantined from the offline canonical certification.
[[baseline_exception]]
id_prefix = "python-pytest::tests/test_real_app_server_integration.py::"
kind = "live-service"
source = "locked KD4 completion-proof plan"
text = "Optional real-app tests remain quarantined; canonical proof uses local processes and loopback fakes only."

# Protected upstream mirrors are inventoried but are not migration edit targets.
[[baseline_exception]]
id_prefix = "rust-nextest::codex-backend-client::"
kind = "protected"
source = "locked KD4 completion-proof plan"
text = "backend-client is a protected mirror and is validated through its editable consumers."

[[baseline_exception]]
id_prefix = "rust-nextest::codex-login::"
kind = "protected"
source = "locked KD4 completion-proof plan"
text = "login is a protected mirror and is validated through its editable consumers."

