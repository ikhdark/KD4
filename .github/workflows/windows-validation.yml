name: Windows validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and focused Rust tests
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      # Dedicated ephemeral target: the public runner owns its admission lock.
      KD4_CI_TARGET: ${{ github.workspace }}/target/windows-ci
      KD4_CI_EVIDENCE: ${{ runner.temp }}/kd4-windows-evidence
      KD4_EXPECTED_SHA: ${{ github.sha }}
      KD4_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      KD4_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TERM_COLOR: never
      NEXTEST_TEST_THREADS: '2'
      RUST_TEST_THREADS: '2'
      RUST_MIN_STACK: '8388608'
      RUST_BACKTRACE: '1'
      CODEX_REQUIRE_WINDOWS_SANDBOX_PROCESS_TESTS: '1'

    steps:
      - name: Check out exact event revision
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The hosted image provides Python >=3.11. Probe and record it before
      # setup, so a failed Rust/tool download still has a structured record.
      - name: Initialize evidence
        id: initialize
        run: python -I -B scripts/build/windows_ci.py initialize

      - name: Cache Cargo downloads
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: windows-ci-downloads-v1-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}

      - name: Set up pinned Rust and nextest
        id: setup
        timeout-minutes: 12
        run: python -I -B scripts/build/windows_ci.py setup

      - name: Build Windows sandbox helpers
        id: build
        timeout-minutes: 30
        run: python -I -B scripts/build/windows_ci.py build

      - name: Run declared Windows gates
        id: test
        timeout-minutes: 30
        run: python -I -B scripts/build/windows_ci.py test

      - name: Finalize and verify evidence
        id: evidence
        if: always()
        env:
          KD4_STEP_RESULTS: ${{ toJSON(steps) }}
        run: python -I -B scripts/build/windows_ci.py finalize

      - name: Upload Windows validation evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kd4-windows-evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
