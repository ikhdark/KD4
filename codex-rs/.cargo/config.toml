[build]
# Bound compiler fanout so local Cargo commands do not saturate the host.
# CARGO_BUILD_JOBS or Cargo's -j/--jobs flag can opt into a different limit.
jobs = 24
# sccache is the shared compiler cache for local builds. Avoid keeping a second,
# much larger incremental cache unless CARGO_INCREMENTAL explicitly opts back in.
incremental = false

[env]
# Bound direct `cargo test` libtest fanout. An existing process environment
# value or libtest's `--test-threads` flag can opt into a different limit.
RUST_TEST_THREADS = { value = "16", force = false }

[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "link-arg=/STACK:8388608", "-C", "target-feature=+crt-static"]

# Cargo joins these target-specific flags with the matching MSVC cfg flags above,
# so keep only the ARM64-specific linker override here.
# MSVC emits a warning about code that may trip "Cortex-A53 MPCore processor bug #843419" (see
# https://developer.arm.com/documentation/epm048406/latest) which is sometimes emitted by LLVM.
# Since Arm64 Windows 10+ isn't supported on that processor, it's safe to disable the warning.
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/arm64hazardfree"]

[target.'cfg(all(windows, target_env = "gnu"))']
rustflags = ["-C", "link-arg=-Wl,--stack,8388608"]
