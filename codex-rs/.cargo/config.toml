[build]
# Bound compiler fanout so local Cargo commands do not saturate the host.
# CARGO_BUILD_JOBS or Cargo's -j/--jobs flag can opt into a different limit.
jobs = 2
# Incremental compilation speeds up local edits to workspace/path crates.
# sccache can cache eligible dependency compilations, but cannot cache rustc
# invocations with -C incremental, regardless of where it was configured.
# This local default also applies to release/package builds. Keep it enabled
# for repeated local packaging; isolated perf recipes explicitly disable it.
incremental = true

[env]
# Bound direct `cargo test` libtest fanout. An existing process environment
# value or libtest's `--test-threads` flag can opt into a different limit.
RUST_TEST_THREADS = { value = "2", force = false }

# Shared by x64 and ARM64. KD4 tooling links both with lld-link when installed
# (scripts/rust_tool_env.py), and lld-link rejects link.exe-only arguments such
# as upstream's ARM64 /arm64hazardfree warning suppressor, so add none here.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "link-arg=/STACK:8388608", "-C", "target-feature=+crt-static"]

[target.'cfg(all(windows, target_env = "gnu"))']
rustflags = ["-C", "link-arg=-Wl,--stack,8388608"]
