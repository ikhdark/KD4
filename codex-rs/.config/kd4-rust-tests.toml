# ---------------------------------------------------------------------------
# Helper binaries
#
# Integration and library tests resolve these through
# `codex_utils_cargo_bin::cargo_bin`, which reads `CARGO_BIN_EXE_*`. The runner
# builds exactly the helpers declared by the selected target into the active
# lane's target directory and exports both the dashed and underscored aliases.
# Every helper a run does not declare is exported as a missing path, so
# `cargo_bin` cannot fall back to an older build left in the persistent lane.
# A declaration is therefore also a denial: keep a helper declared even when no
# target builds it. A package's integration tests receive that package's own
# binaries from Cargo and nextest, so those are neither built nor denied.
# ---------------------------------------------------------------------------

[helpers.codex]
package = "codex-cli"
bin = "codex"

[helpers.codex-app-server]
package = "codex-app-server"
bin = "codex-app-server"

[helpers.codex-code-mode-host]
package = "codex-code-mode-host"
bin = "codex-code-mode-host"

[helpers.test_stdio_server]
package = "codex-rmcp-client"
bin = "test_stdio_server"

[helpers.test_streamable_http_server]
package = "codex-rmcp-client"
bin = "test_streamable_http_server"

[helpers.codex-windows-sandbox-setup]
package = "codex-windows-sandbox"
bin = "codex-windows-sandbox-setup"
platform = "windows"

[helpers.codex-command-runner]
package = "codex-windows-sandbox"
bin = "codex-command-runner"
platform = "windows"

# ---------------------------------------------------------------------------
# Named targets
#
# Target helpers are the fallback for unlisted modules; their union with prefix
# overrides is the upper bound for a caller-filtered `run-target`. In
# codex-core, only `cli_stream` and `live_cli` launch the `codex` CLI; the
# `test_codex()` fixture treats it as optional and nothing in the session runtime
# consumes it. `test_codex()` sessions resolve `codex-code-mode-host` because
# CodeModeHost is enabled by default.
# ---------------------------------------------------------------------------

