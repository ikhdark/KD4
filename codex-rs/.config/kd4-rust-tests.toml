# Named Rust test targets and gates for the fork-local test runner.
#
# `scripts/rust_test_runner.py` is the only supported consumer. The runner
# parses this file strictly: unknown tables and unknown keys are errors, and
# every package, test target, and helper binary named here is validated against
# `cargo metadata --no-deps` before anything is built or run.
#
# Target selection is immutable once a name is chosen: callers pick a target or
# gate by name and may only narrow it with filtering options. Package and test
# target overrides are rejected by the runner.

version = 1

# ---------------------------------------------------------------------------
# Helper binaries
#
# Integration and library tests resolve these through
# `codex_utils_cargo_bin::cargo_bin`, which reads `CARGO_BIN_EXE_*`. The runner
# builds exactly the helpers declared by the selected target into the active
# lane's target directory and exports both the dashed and underscored aliases.
# ---------------------------------------------------------------------------

[helpers.codex]
package = "codex-cli"
bin = "codex"

[helpers.codex-code-mode-host]
package = "codex-code-mode-host"
bin = "codex-code-mode-host"

[helpers.test_stdio_server]
package = "codex-rmcp-client"
bin = "test_stdio_server"

[helpers.test_streamable_http_server]
package = "codex-rmcp-client"
bin = "test_streamable_http_server"

[helpers.codex-windows-sandbox-setup]
package = "codex-windows-sandbox"
bin = "codex-windows-sandbox-setup"
platform = "windows"

[helpers.codex-command-runner]
package = "codex-windows-sandbox"
bin = "codex-command-runner"
platform = "windows"

# ---------------------------------------------------------------------------
# Named targets
# ---------------------------------------------------------------------------

[targets.core_lib]
package = "codex-core"
lib = true
helpers = [
  "codex",
  "codex-code-mode-host",
  "test_stdio_server",
  "codex-windows-sandbox-setup",
  "codex-command-runner",
]

[targets.available_skills_instructions]
package = "codex-core"
test = "available_skills_instructions"
helpers = ["codex", "codex-code-mode-host"]

[targets.responses_headers]
package = "codex-core"
test = "responses_headers"
helpers = ["codex", "codex-code-mode-host"]

[targets.round_trip_batching]
package = "codex-core"
test = "round_trip_batching"
helpers = ["codex", "codex-code-mode-host"]

[targets.turn_latency_bench]
package = "codex-core"
test = "turn_latency_bench"
helpers = ["codex", "codex-code-mode-host"]

# Bounded core integration targets. Every shard carries the conservative
# runtime helper pair; MCP, stdio, and Windows sandbox helpers are added only
# where the assigned modules need them.

[targets.core_cli_workspace]
package = "codex-core"
test = "core_cli_workspace"
helpers = ["codex", "codex-code-mode-host"]

[targets.core_code_mode_mcp]
package = "codex-core"
test = "core_code_mode_mcp"
helpers = [
  "codex",
  "codex-code-mode-host",
  "test_stdio_server",
  "test_streamable_http_server",
]

[targets.core_exec_permissions]
package = "codex-core"
test = "core_exec_permissions"
helpers = [
  "codex",
  "codex-code-mode-host",
  "codex-windows-sandbox-setup",
  "codex-command-runner",
]

[targets.core_thread_state]
package = "codex-core"
test = "core_thread_state"
helpers = ["codex", "codex-code-mode-host", "test_stdio_server"]

[targets.core_transport_telemetry]
package = "codex-core"
test = "core_transport_telemetry"
helpers = ["codex", "codex-code-mode-host"]

[targets.core_agents_review]
package = "codex-core"
test = "core_agents_review"
helpers = ["codex", "codex-code-mode-host"]

[targets.core_model_prompt_runtime]
package = "codex-core"
test = "core_model_prompt_runtime"
helpers = ["codex", "codex-code-mode-host"]

[targets.core_windows]
package = "codex-core"
test = "core_windows"
helpers = [
  "codex",
  "codex-code-mode-host",
  "codex-windows-sandbox-setup",
  "codex-command-runner",
]

# `codex-config` owns the raw adaptive-reasoning tables; the adaptive reasoning
# gate pairs it with the resolved `codex-core` defaults in one ordered run.
[targets.config_lib]
package = "codex-config"
lib = true
helpers = []

# ---------------------------------------------------------------------------
# Named gates
#
# Each gate is an ordered list of steps. A step names a target, an optional
# nextest filterset, and the exact set of test IDs the step must select. The
# runner fails when the listed IDs and the declared IDs are not equal, so a
# renamed or deleted test can never silently drop out of a gate.
# ---------------------------------------------------------------------------

[gates.adaptive-reasoning-contract]
description = "Raw config tables, resolved defaults, and reachable sampling policy."

[[gates.adaptive-reasoning-contract.steps]]
target = "config_lib"
filter = "test(reasoning_phase_efforts_distinguish_absent_empty_partial_and_full_tables) | test(empty_higher_reasoning_phase_table_preserves_lower_entries) | test(partial_higher_reasoning_phase_table_merges_per_field)"
tests = [
  "config_toml::tests::reasoning_phase_efforts_distinguish_absent_empty_partial_and_full_tables",
  "merge::tests::empty_higher_reasoning_phase_table_preserves_lower_entries",
  "merge::tests::partial_higher_reasoning_phase_table_merges_per_field",
]

[[gates.adaptive-reasoning-contract.steps]]
target = "core_lib"
filter = "test(load_config_defaults_phase_tracking_to_compatibility_efforts) | test(load_config_preserves_explicit_reasoning_phase_effort_overrides) | test(load_config_preserves_all_explicit_reasoning_phase_effort_overrides) | test(reachable_changed_continuation_uses_the_lowest_supported_explicit_override) | test(reachable_changed_continuation_defaults_to_low_even_when_turn_is_high) | test(request_policy_rejects_host_terminal_completion) | test(protocol_terminal_continuation_is_marked_for_host_elision_only_when_unchanged) | test(global_effort_survives_unoverridden_decision_bearing_phases)"
tests = [
  "config::tests::load_config_defaults_phase_tracking_to_compatibility_efforts",
  "config::tests::load_config_preserves_all_explicit_reasoning_phase_effort_overrides",
  "config::tests::load_config_preserves_explicit_reasoning_phase_effort_overrides",
  "session::reasoning_governor::tests::global_effort_survives_unoverridden_decision_bearing_phases",
  "session::reasoning_governor::tests::protocol_terminal_continuation_is_marked_for_host_elision_only_when_unchanged",
  "session::reasoning_governor::tests::reachable_changed_continuation_defaults_to_low_even_when_turn_is_high",
  "session::reasoning_governor::tests::reachable_changed_continuation_uses_the_lowest_supported_explicit_override",
  "session::reasoning_governor::tests::request_policy_rejects_host_terminal_completion",
]

[gates.config-schema-protocol]
description = "Config schema fixture parity without regenerating generated output."

[[gates.config-schema-protocol.steps]]
target = "core_lib"
filter = "test(config_schema_matches_fixture) | test(config_schema_hides_unsupported_inline_mcp_bearer_token)"
tests = [
  "config::schema::tests::config_schema_hides_unsupported_inline_mcp_bearer_token",
  "config::schema::tests::config_schema_matches_fixture",
]

[gates.windows-sandbox-core-exec]
description = "codex-core leg of the Windows sandbox process-tree gate."

[[gates.windows-sandbox-core-exec.steps]]
target = "core_lib"
filter = "test(direct_exec_cancellation_terminates_windows_descendants)"
tests = ["exec::tests::direct_exec_cancellation_terminates_windows_descendants"]

[gates.core-stdio-helper-regressions]
description = "Library regressions that used to exit silently when test_stdio_server was missing."

[[gates.core-stdio-helper-regressions.steps]]
target = "core_lib"
filter = "test(pending_plan_and_router_reuse_one_step_mcp_inventory_snapshot) | test(requested_mcp_servers_are_refreshed_before_install_completion)"
tests = [
  "session::turn::tests::pending_plan_and_router_reuse_one_step_mcp_inventory_snapshot",
  "tools::handlers::request_plugin_install::tests::requested_mcp_servers_are_refreshed_before_install_completion",
]

[gates.rmcp-streamable-http]
description = "Streamable HTTP MCP round trips that require test_streamable_http_server."

[[gates.rmcp-streamable-http.steps]]
target = "core_code_mode_mcp"
filter = "test(streamable_http_tool_call_round_trip) | test(streamable_http_configured_auth_precedes_chatgpt_auth) | test(streamable_http_with_oauth_round_trip)"
tests = [
  "suite::rmcp_client::streamable_http_configured_auth_precedes_chatgpt_auth",
  "suite::rmcp_client::streamable_http_tool_call_round_trip",
  "suite::rmcp_client::streamable_http_with_oauth_round_trip",
]


# Capability checks reuse exact gates. Helpers on a step override the target's
# conservative defaults only for that fixed proof. An omitted list inherits
# the defaults; an explicit empty list is a library-only proof.
[helpers.codex-app-server]
package = "codex-app-server"
bin = "codex-app-server"

[targets.extension_registry]
package = "codex-extension-api"
test = "registry"
helpers = []

[targets.shell_command_lib]
package = "codex-shell-command"
lib = true
helpers = []

[targets.app_server_initialize]
package = "codex-app-server"
test = "all"
helpers = ["codex-app-server", "codex-code-mode-host"]

[targets.cli_bin]
package = "codex-cli"
bin = "codex"
helpers = []

[targets.agent_task_store_lib]
package = "codex-agent-task-store"
lib = true
helpers = []

[gates.capability-extension-boundary-core]
description = "Reuse ToolContributor, ToolLifecycleContributor, and ContextContributor before adding KD4-only hooks."
[[gates.capability-extension-boundary-core.steps]]
target = "extension_registry"
tests = ["build_round_trips_every_contributor_category"]
helpers = []

[gates.capability-structured-command-execution]
description = "Script and argv command shapes with untagged legacy compatibility; explicitly tagged legacy input is rejected."
[[gates.capability-structured-command-execution.steps]]
target = "core_lib"
tests = ["tools::handlers::command_shape::command_shape_tests::tagged_script_is_canonical_and_tagged_legacy_is_rejected"]
helpers = []

[gates.capability-command-preflight]
description = "Active preflight with one bounded read-only equivalent repair and rejection-only mutating commands."
[[gates.capability-command-preflight.steps]]
target = "core_lib"
tests = ["tools::handlers::command_preflight::command_preflight_tests::never_repairs_mutating_command_flag_typos"]
helpers = []

[gates.capability-shell-output-summary]
description = "Bounded failure-focused output on classic and unified execution paths."
[[gates.capability-shell-output-summary.steps]]
target = "core_lib"
tests = ["tools::shell_output_summary::tests::failed_output_keeps_exact_error_lines"]
helpers = []

[gates.capability-command-attempt-ledger]
description = "Session-bounded command fingerprints with repair accounting and third-identical-failure prevention."
[[gates.capability-command-attempt-ledger.steps]]
target = "core_lib"
tests = ["tools::command_execution::tests::input_state_determined_failure_blocks_exact_retry_but_freshness_bypasses"]
helpers = []

[gates.capability-command-output-artifacts]
description = "Addressable full raw command output streamed before bounded transcript retention or model summarization, including background completion."
[[gates.capability-command-output-artifacts.steps]]
target = "core_lib"
tests = ["tools::handlers::unified_exec::tests::foreground_output_artifact_retains_bytes_beyond_transcript_cap"]
helpers = ["codex", "codex-code-mode-host", "codex-windows-sandbox-setup", "codex-command-runner"]

[gates.capability-preferred-powershell-host]
description = "Explicit PowerShell paths win, otherwise pwsh is preferred with Windows PowerShell compatibility fallback."
[[gates.capability-preferred-powershell-host.steps]]
target = "shell_command_lib"
tests = ["shell_detect::tests::powershell_resolver_prefers_pwsh_then_compatibility_host"]
helpers = []

[gates.capability-app-server-runtime-provenance]
description = "Build, install, runtime, and KD4 watermark metadata at initialization."
[[gates.capability-app-server-runtime-provenance.steps]]
target = "app_server_initialize"
tests = ["suite::v2::initialize::initialize_response_includes_local_runtime_metadata"]
helpers = ["codex-app-server", "codex-code-mode-host"]

[gates.capability-tool-search-routing]
description = "Cached and diversified discovery of deferred core and extension tools."
[[gates.capability-tool-search-routing.steps]]
target = "core_lib"
tests = ["tools::spec_plan::tests::tool_search_cache_rebuilds_when_deferred_sources_change"]
helpers = []

[gates.capability-config-explain]
description = "Human-readable configuration reference exposed through codex config explain."
[[gates.capability-config-explain.steps]]
target = "cli_bin"
tests = ["tests::config_explain_parses_optional_filter"]
helpers = []

[gates.capability-shared-worktree-reliability]
description = "Nonblocking workspace revision and path-event tracking, advisory claims, best-effort mutation evidence, validation singleflight, lifecycle quiescence, and versioned isolated-worktree handoffs."
[[gates.capability-shared-worktree-reliability.steps]]
target = "agent_task_store_lib"
tests = ["tests::completed_receipt_rejects_workspace_change_after_validation"]
helpers = []
