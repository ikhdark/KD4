# ---------------------------------------------------------------------------
# Named gates
#
# Each gate is an ordered list of steps with authoritative exact test IDs.
# The runner derives exact nextest filters and requires every declared test to
# report a pass exactly once. No discovery build is needed for normal execution;
# `check-gates` explicitly verifies discovery without running tests or helpers.
#
# Each test ID is owned by one gate; batching gates runs compatible steps in one
# invocation. Helpers on a step override the target's upper bound only for that
# fixed proof. An omitted list inherits the target helpers; an explicit empty
# list is a helper-free proof. Every core_lib step declares its helpers.
# ---------------------------------------------------------------------------

