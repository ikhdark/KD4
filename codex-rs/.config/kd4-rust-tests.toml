# Named Rust test targets and gates for the fork-local test runner.
#
# `scripts/rust_test_runner.py` is the only supported consumer. The runner
# parses this file strictly: unknown tables and unknown keys are errors, and
# selected targets and helpers are validated against `cargo metadata --no-deps`
# before execution. `check-manifest` validates every declaration.
#
# Target selection is immutable once a name is chosen: callers pick a target or
# gate by name and may only narrow it with filtering options. Package and test
# target overrides are rejected by the runner.

version = 1

