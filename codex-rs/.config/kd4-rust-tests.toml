# Named Rust test targets and gates for the fork-local test runner.
#
# `scripts/build/rust_test_runner.py` is the only supported consumer. The runner
# parses this file strictly: unknown tables and unknown keys are errors, and
# selected targets and helpers are validated against `cargo metadata --no-deps`
# before execution. `check-manifest` validates every declaration.
#
# Target selection is immutable once a name is chosen: callers pick a target or
# gate by name and may only narrow it with filtering options. Package and test
# target overrides are rejected by the runner.

version = 1

# Older runners reject this versioned table rather than silently dropping a
# required consumer. Direct ownership advice remains separate from obligations.
[contracts]
version = 1

[contracts.obligations.validation-command-consumers]
paths = ["codex-rs/shell-command/src/validation.rs"]
required_gates = ["validation-command-recognition", "validation-bloat-contracts"]
consumer = "Core exec observation policy consumes shell-command validation classification; recognized validation must retain its waiting and output contracts."

[contracts.obligations.command-exec-consumers]
paths = ["codex-rs/app-server-protocol/src/protocol/v2/command_exec.rs"]
required_gates = ["app-server-command-exec"]
consumer = "Command/exec wire types require sibling literal-JSON oracles and the app-server output-cap transport consumer, not only module ownership advice."

[contracts.obligations.config-schema-fixture]
paths = ["codex-rs/core/config.schema.json", "codex-rs/config/src/schema.rs", "codex-rs/config/src/schema_fixture_tests.rs"]
required_gates = ["config-schema-protocol"]
consumer = "The config crate embeds the core schema fixture and checks generated JSON and the public writer against it."

[contracts.obligations.validation-protocol]
paths = ["codex-rs/protocol/src/validation.rs"]
required_gates = ["validation-protocol"]
consumer = "Shared direct-validation types must preserve exact wire statuses, required fields, argument identity, and normalized repository scopes."

[contracts.obligations.validation-analysis-consumers]
paths = ["codex-rs/command-analysis/src/validation.rs"]
required_gates = ["validation-bloat-contracts"]
consumer = "Core exec and shell handlers consume command-analysis validation classification and must preserve waiting, output, and accounting contracts."

[contracts.obligations.thread-start-schema-consumers]
paths = ["codex-rs/app-server-protocol/src/protocol/v2/thread.rs"]
required_gates = ["app-server-schema-fixtures"]
consumer = "ThreadStartParams is exported through the request protocol into committed JSON and TypeScript schemas; library ownership alone does not check generated fixtures."

[contracts.obligations.completion-filter-consumers]
paths = ["codex-rs/core/src/session/turn.rs", "codex-rs/core/src/session/turn_execution.rs", "codex-rs/core/src/task_acceptance.rs"]
required_gates = ["completion-path-evidence"]
consumer = "Turn completion and acceptance feed ordinary and direct final delivery; retain the filter-declared completion evidence gate in source-based planning."

[contracts.obligations.registry-filter-consumers]
paths = ["codex-rs/core/src/tools/registry.rs"]
required_gates = ["completion-path-evidence"]
consumer = "Registry typed validation receipts participate in the completion evidence contract, beyond direct module ownership."

[contracts.obligations.transport-filter-consumers]
paths = ["codex-rs/core/src/client.rs", "codex-rs/core/tests/suite/client_websockets.rs"]
required_gates = ["wall-clock-runtime"]
consumer = "Model transport preconnect and recovery are consumed by the filter-only WebSocket transport regressions."

[contracts.obligations.code-mode-filter-consumers]
paths = ["codex-rs/code-mode-host/src/peer.rs", "codex-rs/code-mode-runtime/src/session_runtime/mod.rs"]
required_gates = ["wall-clock-runtime"]
consumer = "Code Mode peer admission and durable session results feed host and runtime filter/exact steps in the wall-clock gate."

