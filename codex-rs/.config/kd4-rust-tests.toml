[gates.windows-process-coverage]
description = "Windows ConPTY, process-tree, cancellation, and wait-failure coverage."

[[gates.windows-process-coverage.steps]]
target = "pty_lib"
filter = "test(terminate_kills_descendants_for_best_effort_pipe_and_atomic_conpty) | test(normal_exit_preserves_descendants_for_pipe_and_conpty) | test(conpty_delivers_input_to_foreground_children) | test(conpty_ctrl_c_interrupts_powershell_foreground_child) | test(required_process_test_prerequisites_report_unverified_coverage)"
tests = [
  "tests::windows_tests::conpty_ctrl_c_interrupts_powershell_foreground_child",
  "tests::windows_tests::conpty_delivers_input_to_foreground_children",
  "tests::windows_tests::normal_exit_preserves_descendants_for_pipe_and_conpty",
  "tests::windows_tests::required_process_test_prerequisites_report_unverified_coverage",
  "tests::windows_tests::terminate_kills_descendants_for_best_effort_pipe_and_atomic_conpty",
]

[[gates.windows-process-coverage.steps]]
