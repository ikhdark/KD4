tests = [
  "win::tests::controlling_ipc_eof_terminates_process_tree",
  "win::tests::invalid_process_wait_is_not_treated_as_exit",
]

[[gates.windows-process-coverage.steps]]
target = "core_lib"
filter = "test(direct_exec_cancellation_terminates_windows_descendants)"
tests = ["exec::tests::direct_exec_cancellation_terminates_windows_descendants"]

