experimental = ["setup-scripts"]

[profile.default]
# Flag a test as slow after 30s and terminate it after 60s. Tests that
# legitimately need longer get a narrowly scoped override below.
slow-timeout = { period = "30s", terminate-after = 2 }
# Report a flaky or hanging test on its first attempt. A retry would turn a
# flake into a pass and double the time until a deterministic hang fails.
retries = 0
# Bound local test fanout; retain narrower groups below.
# NEXTEST_TEST_THREADS or --test-threads can opt into a different limit.
test-threads = 8

[scripts.setup.windows-test-stack]
command = ["python", "scripts/nextest_windows_stack.py"]

[[profile.default.scripts]]
# Windows binaries are linked with an 8 MiB main stack, but libtest creates its
# per-test worker threads from RUST_MIN_STACK. Keep nextest's workers aligned
# with the runtime/test-binary stack contract.
platform = { host = 'cfg(windows)' }
setup = 'windows-test-stack'

# Nextest resolves settings, per-test overrides, and setup scripts through the
# whole `inherits` chain (fast -> local -> default), so derived profiles only
# declare what they change.
[profile.local]
inherits = "default"
# Finish the selected tests so local fixes can address failures in batches.
fail-fast = false
# Report counts and failures; gate commands capture PASS lines to verify selection.
status-level = "fail"
final-status-level = "fail"
failure-output = "final"

[profile.fast]
inherits = "local"
# Preserve the real continuation boundary in `test-slow-boundaries`, not in
# every edit loop. The HTTP transport boundary now uses a short injected timeout.
default-filter = '''
not test(=suite::code_mode::owned_continuation::printed_process_receipts_do_not_interrupt_a_predetermined_drain)
'''

# The ChatGPT login server binds fixed callback ports 1455/1457, and a new
# server sends `/cancel` to whichever process already holds them.
# `#[serial(login_port)]` only serializes tests inside one process, and nextest
# runs every test in its own process.
[test-groups.login_callback_port]
max-threads = 1

# Each test launches its own subprocesses. Keep their combined load below the
# ordinary worker limit, including when NEXTEST_TEST_THREADS is raised.
[test-groups.process_heavy]
max-threads = 4

[test-groups.windows_sandbox_legacy_sessions]
max-threads = 1

[test-groups.windows_core]
max-threads = 2

[[profile.default.overrides]]
# Opt-in live A/B has two bounded ten-minute turns, not a mock-server test.
filter = 'package(codex-core) & test(=suite::code_mode::token_cache_e2e::live::integrated_live_model_pair)'
slow-timeout = { period = "1m", terminate-after = 22 }

[[profile.default.overrides]]
# These tests start the real login server on its fixed callback ports. Keep
# this before the process_heavy override: the first matching test-group wins.
filter = '''
(package(codex-app-server) & kind(lib)
    & test(=request_processors::account_processor::tests::cancelled_login_start_closes_callback_before_registry_ownership))
| (package(codex-login) & binary(all)
    & test(=suite::login_server_e2e::falls_back_to_registered_fallback_port_when_default_port_is_in_use))
'''
test-group = 'login_callback_port'

[[profile.default.overrides]]
# These Windows tests spawn the codex CLI or a JSON-RPC stdio client per case
# and have been the dominant source of 30s timeouts. core's suite::resume runs
# in process, so only codex-exec's resume suite belongs here.
platform = 'cfg(windows)'
filter = '(package(codex-exec) & (test(suite::resume::) | test(suite::auth_env::))) | (package(codex-core) & test(suite::cli_stream::)) | test(connect_stdio_command_initializes_json_rpc_client_on_windows)'
test-group = 'process_heavy'
slow-timeout = { period = "1m", terminate-after = 2 }

[[profile.default.overrides]]
# App-server integration tests spawn a fresh app-server subprocess per case, and
# core apply_patch_cli tests run full Codex turns that launch apply_patch. Both
# use isolated homes and ephemeral ports. The library unit tests stay ungrouped.
filter = '(package(codex-app-server) & kind(test) & not test(suite::v2::analytics::app_server_default_analytics_)) | (package(codex-core) & kind(test) & test(suite::apply_patch_cli::))'
test-group = 'process_heavy'

[[profile.default.overrides]]
# These tests create restricted-token Windows child processes and private desktops.
# Serialize only the unified-exec process tests to avoid exhausting Windows
# session/global desktop resources; their in-process LEGACY_PROCESS_TEST_LOCK
# cannot serialize separate nextest processes. The delete-child probe is cached
# and unsafe kernels fail closed before process startup, so the default timeout
# is sufficient.
platform = 'cfg(windows)'
filter = 'package(codex-windows-sandbox) & test(unified_exec::tests::legacy_)'
test-group = 'windows_sandbox_legacy_sessions'

[[profile.default.overrides]]
# Bound modules that start shells, Git, MCP or sandboxed subprocesses. Pure
# guidance, history, schema and tool-spec tests use the global worker pool.
platform = 'cfg(windows)'
filter = '''
package(codex-core) & (
    test(unified_exec::)
  | test(/^shell::tests::/)
  | test(shell_snapshot::)
  | test(user_shell_command::)
  | test(exec_policy::)
  | test(git_info::)
  | test(git_workspace::)
  | test(turn_diff_tracker::)
  | test(tools::sandboxing::)
  | test(tools::handlers::shell::tests::) & not test(tools::handlers::shell::tests::pure::)
  | test(tools::handlers::command_preflight::)
  | test(tools::handlers::command_windows_corpus::)
  | test(tools::handlers::agent_jobs::)
  | test(suite::shell_command::)
  | test(suite::unified_exec::)
  | test(suite::windows_sandbox::)
  | test(suite::user_shell_cmd::)
  | test(suite::mcp::)
  | test(suite::code_mode::)
)
'''
test-group = 'windows_core'

[[profile.default.overrides]]
# This regression creates 10,000 rollouts for one exhaustive listing.
# Windows filesystem latency exceeds the default one-minute allowance.
platform = "cfg(windows)"
filter = "package(codex-rollout) & test(filesystem_listing_reaches_threads_beyond_the_former_scan_cap)"
slow-timeout = { period = "1m", terminate-after = 5 }
