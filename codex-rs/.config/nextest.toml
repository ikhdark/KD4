experimental = ["setup-scripts"]

[profile.default]
# Retry once so one transient failure does not fail full-CI outright.
# Fanout keeps the full-CI shards moving without treating every >30s test as
# stuck. Keep this aligned with the broader timeout budget we give sharded CI.
slow-timeout = { period = "30s", terminate-after = 2 }
retries = 1
# Avoid saturating developer machines when Nextest is invoked directly.
# NEXTEST_TEST_THREADS or --test-threads can opt into a different limit.
test-threads = 4

[scripts.setup.windows-test-stack]
command = ["python", "scripts/nextest_windows_stack.py"]

[[profile.default.scripts]]
# Windows binaries are linked with an 8 MiB main stack, but libtest creates its
# per-test worker threads from RUST_MIN_STACK. Keep nextest's workers aligned
# with the runtime/test-binary stack contract.
platform = { host = 'cfg(windows)' }
setup = 'windows-test-stack'

[profile.default.junit]
path = "junit.xml"

[profile.local]
inherits = "default"

[profile.fast]
inherits = "local"
retries = 0

# The canonical whole-repository runner must observe a fresh result for every
# selected test.  It also passes these settings explicitly, but keeping them in
# a dedicated profile makes an accidental retry or fail-fast override visible
# in nextest's resolved configuration.
[profile.completion-proof]
inherits = "default"
retries = 0
fail-fast = false

[test-groups.app_server_protocol_codegen]
max-threads = 1

[test-groups.app_server_integration]
max-threads = 1

# Higher concurrency causes integration test timeouts under resource contention
# on common developer machines.
[test-groups.app_server_integration_local]
max-threads = 1

[test-groups.core_apply_patch_cli_integration]
max-threads = 1

[test-groups.windows_sandbox_legacy_sessions]
max-threads = 1

[test-groups.windows_process_heavy]
max-threads = 2

[test-groups.windows_core]
max-threads = 4

[test-groups.windows_completion_proof_sessions]
max-threads = 1

[[profile.default.overrides]]
# Do not add new tests here
filter = 'test(rmcp_client) | test(humanlike_typing_1000_chars_appears_live_no_placeholder)'
slow-timeout = { period = "2m", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'test(approval_matrix_covers_all_modes)'
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'package(codex-app-server-protocol) & (test(typescript_schema_fixtures_match_generated) | test(json_schema_fixtures_match_generated) | test(generate_ts_with_experimental_api_retains_experimental_entries) | test(generated_ts_optional_nullable_fields_only_in_params) | test(generate_json_filters_experimental_fields_and_methods))'
test-group = 'app_server_protocol_codegen'

[[profile.default.overrides]]
# This exact app-server session runs canonical proof through the Windows
# restricted-token sandbox. Serialize it with the other completion-proof
# sessions so cross-test setup contention is not added to the cold setup.
platform = 'cfg(windows)'
filter = 'package(codex-app-server) & binary(all) & test(=suite::v2::client_metadata::same_process_resume_reuses_completion_proof_but_restart_does_not_v2)'
test-group = 'windows_completion_proof_sessions'

[[profile.default.overrides]]
# These integration tests spawn a fresh app-server subprocess per case.
# Keep the library unit tests parallel.
filter = 'package(codex-app-server) & kind(test)'
test-group = 'app_server_integration'

[[profile.local.overrides]]
# Use up to four app-server subprocesses locally. The global nextest pool still
# limits this to the machine's logical CPU count.
filter = 'package(codex-app-server) & kind(test)'
test-group = 'app_server_integration_local'

[[profile.fast.overrides]]
# `fast` resolves its own overrides before `default`; keep the exact
# completion-proof session out of the broader local app-server group.
platform = 'cfg(windows)'
filter = 'package(codex-app-server) & binary(all) & test(=suite::v2::client_metadata::same_process_resume_reuses_completion_proof_but_restart_does_not_v2)'
test-group = 'windows_completion_proof_sessions'

[[profile.fast.overrides]]
# Nextest resolves per-test overrides from the selected profile and `default`,
# not from intermediate profiles. Mirror the bounded local concurrency here so
# fast validation does not fall back to the serialized CI group.
filter = 'package(codex-app-server) & kind(test)'
test-group = 'app_server_integration_local'

[[profile.default.overrides]]
# These tests exercise full Codex turns and apply_patch execution, and they are
# sensitive to Windows runner process-startup stalls when many cases launch at once.
filter = 'package(codex-core) & kind(test) & test(apply_patch_cli)'
test-group = 'core_apply_patch_cli_integration'

[[profile.default.overrides]]
# These tests create restricted-token Windows child processes and private desktops.
# Serialize only the unified-exec process tests to avoid exhausting Windows
# session/global desktop resources. The delete-child probe is cached and unsafe
# kernels fail closed before process startup, so the default timeout is sufficient.
platform = 'cfg(windows)'
filter = 'package(codex-windows-sandbox) & test(unified_exec::tests::legacy_)'
test-group = 'windows_sandbox_legacy_sessions'

[[profile.default.overrides]]
# This Codex-home startup path still exceeded the broader Windows-heavy ceiling
# in both Windows full-CI lanes after contention was reduced.
platform = 'cfg(windows)'
filter = 'test(start_thread_uses_all_default_environments_from_codex_home)'
slow-timeout = { period = "2m", terminate-after = 2 }

[[profile.default.overrides]]
# These Windows-heavy tests spawn subprocesses, session files, or JSON-RPC
# clients and have been the dominant source of 30s full-CI timeouts.
platform = 'cfg(windows)'
filter = 'test(suite::resume::) | test(suite::cli_stream::) | test(suite::auth_env::) | test(start_thread_uses_all_default_environments_from_codex_home) | test(connect_stdio_command_initializes_json_rpc_client_on_windows)'
test-group = 'windows_process_heavy'
slow-timeout = { period = "1m", terminate-after = 2 }

[[profile.default.overrides]]
# These exact completion-proof session tests deliberately exercise a full
# forced-terminal budget or a cold Windows resume. Let the real runtime path
# return its own result instead of terminating it at the module-wide ceiling.
platform = 'cfg(windows)'
filter = 'package(codex-core) & binary(core_cli_workspace) & (test(=suite::completion_proof_gate::canonical_proof_survives_same_process_compact_resume_and_authorized_root_fork) | test(=suite::completion_proof_gate::differently_cased_windows_paths_preserve_repository_and_rollout_identity) | test(=suite::completion_proof_gate::explicit_admission_not_session_source_selects_terminal_authority) | test(=suite::completion_proof_gate::current_evidence_real_session_executes_both_and_rejects_nonterminal_misuse))'
slow-timeout = { period = "2m", terminate-after = 2 }

[[profile.default.overrides]]
# This exact canonical-failure session exceeded the module-wide Windows ceiling
# before the real-path validation returned a result.
platform = 'cfg(windows)'
filter = 'package(codex-core) & binary(core_cli_workspace) & test(=suite::completion_proof_gate::changed_trusted_helper_is_rejected_before_canonical_failure_can_poison)'
slow-timeout = { period = "2m", terminate-after = 2 }

[[profile.default.overrides]]
# These real-session proof-gate tests create isolated homes, but their Windows
# sandbox setup still shares the process-wide setup mutex. Serialize the module
# so nextest's per-test timeout measures the test instead of mutex contention.
platform = 'cfg(windows)'
filter = 'package(codex-core) & binary(core_cli_workspace) & test(suite::completion_proof_gate::)'
test-group = 'windows_completion_proof_sessions'
slow-timeout = { period = "1m", terminate-after = 2 }

[[profile.default.overrides]]
# These real app-server and MCP sessions use a 120-second protocol deadline.
# Give only these exact tests enough time to return their own result on Windows.
platform = 'cfg(windows)'
filter = '(package(codex-app-server) & binary(all) & (test(=suite::v2::turn_start::blocked_completion_proof_reaches_app_server_as_failed_turn_without_launching_runner) | test(=suite::v2::turn_start::desktop_fresh_home_missing_canonical_command_blocks_changed_repository))) | (package(codex-mcp-server) & binary(all) & test(=suite::codex_tool::blocked_completion_proof_reaches_mcp_as_error_without_launching_runner))'
slow-timeout = { period = "2m", terminate-after = 2 }

[[profile.default.overrides]]
# This exact app-server session runs certification, resumes in process, then
# restarts the server. Let its bounded protocol path return its own result.
platform = 'cfg(windows)'
filter = 'package(codex-app-server) & binary(all) & test(=suite::v2::client_metadata::same_process_resume_reuses_completion_proof_but_restart_does_not_v2)'
slow-timeout = { period = "2m", terminate-after = 2 }

[[profile.default.overrides]]
# This exact CLI integration starts the real app-server and runs canonical
# certification through the Windows restricted-token sandbox.
platform = 'cfg(windows)'
filter = 'package(codex-cli) & binary(completion_proof) & test(=real_cli_app_server_accepts_canonical_completion_proof_via_direct_argv)'
slow-timeout = { period = "2m", terminate-after = 2 }

[[profile.default.overrides]]
# Core's Windows library tests include real PowerShell parsing and child-process
# execution. Bound the whole package so those internal deadlines remain meaningful
# instead of measuring scheduler starvation on developer machines.
platform = 'cfg(windows)'
filter = 'package(codex-core)'
test-group = 'windows_core'
