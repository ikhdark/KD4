[workspace.lints]
rust = {}

[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"

[workspace.metadata.cargo-shear]
ignored = [
    "icu_provider",
]

[profile.dev]
# Minimize local build work; optimized runtime builds use release profiles.
opt-level = 0
debug = "none"
lto = "off"
codegen-units = 256
incremental = true
debug-assertions = false
overflow-checks = false

[profile.dev-small]
inherits = "dev"
opt-level = 0
debug = "none"
strip = "symbols"

[profile.dev-small.package."*"]
debug = "none"

[profile.release]
opt-level = 3
lto = "thin"
debug = "line-tables-only"
split-debuginfo = "off"
# Release archives do not publish a separate symbol bundle. Strip symbols in
# the owner build so distributable binaries cannot silently retain them.
strip = "symbols"

# Final publish and ordinary release share one source of optimization settings.
codegen-units = 1
incremental = false

[profile.release.package."*"]
codegen-units = 1

# Retain the final publisher's profile name and isolated output directory.
[profile.local-release]
inherits = "release"

# Build-speed-first local publishes: disable optimization, debug info, and LTO.
# Keep release semantics (no debug assertions/overflow checks), but trade peak
# runtime optimization for shorter edit/build/publish cycles.
[profile.local-fast]
inherits = "release"
opt-level = 0
debug = "none"
lto = "off"
codegen-units = 16
incremental = true

# Preserve fast-build dependency parallelism when the release defaults change.
[profile.local-fast.package."*"]
codegen-units = 4

# Both PGO passes use this same Cargo profile, in separate target directories.
[profile.local-pgo]
inherits = "local-release"
incremental = false

[profile.profiling]
inherits = "release"
debug = "full"
lto = false
strip = false
# Keep the existing profiling behavior independent of final-publish tuning.
codegen-units = 4
incremental = false

[profile.profiling.package."*"]
codegen-units = 4

[patch.crates-io]
notify = { path = "../third_party/notify" }
# Keep the locked release; narrowly repair UDP wildcard endpoint binding and port pinning.
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
# Same pinned production source; omit raw credential-bearing handshake diagnostics.
tungstenite = { path = "../third_party/tungstenite" }

# Uncomment to debug local changes.
# rmcp = { path = "../../rust-sdk/crates/rmcp" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { path = "../third_party/tungstenite" }

[patch."https://github.com/openai-oss-forks/tungstenite-rs"]
tungstenite = { path = "../third_party/tungstenite" }
