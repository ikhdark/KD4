[package]
edition.workspace = true
license.workspace = true
name = "codex-code-mode-runtime"
version.workspace = true

[lib]
doctest = false
name = "codex_code_mode_runtime"
path = "src/lib.rs"

[features]
sandbox = ["v8/v8_enable_sandbox"]

[lints]
workspace = true

[dependencies]
codex-code-mode-protocol = { workspace = true }
codex-protocol = { workspace = true }
deno_core_icudata = { workspace = true }
fs2 = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
v8 = { workspace = true }
