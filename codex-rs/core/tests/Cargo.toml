[package]
name = "codex-core-integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
# codex-core's integration tests live in their own package so that codex-core's
# dev-dependencies do not include `core_test_support`, which depends on
# codex-core: a unit-test build then needs only the codex-core test unit.
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lints]
workspace = true

[[test]]
name = "core_agents_review"
path = "core_agents_review.rs"

[[test]]
name = "core_cli_workspace"
path = "core_cli_workspace.rs"

[[test]]
name = "core_code_mode_mcp"
path = "core_code_mode_mcp.rs"

[[test]]
name = "core_exec_permissions"
path = "core_exec_permissions.rs"

[[test]]
name = "core_model_prompt_runtime"
path = "core_model_prompt_runtime.rs"

[[test]]
name = "core_thread_state"
path = "core_thread_state.rs"

[[test]]
name = "core_transport_telemetry"
path = "core_transport_telemetry.rs"

