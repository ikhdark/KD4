# A model transport session is turn-scoped. Only the reviewed one-shot startup
# handoff and the standalone compaction attempt may retain it in an ADT field.
[[semantic-type-policy.retention]]
id = "kd4-model-client-session-turn-scope"
retained-adt = "codex_core::client::ModelClientSession"
allowed-owner-adts = [
  "codex_core::session_startup_prewarm::SessionStartupPrewarmHandle",
  "codex_core::session_startup_prewarm::SessionStartupTransportHandle",
  "codex_core::session_startup_prewarm::SessionStartupTransportResolution",
  "codex_core::session_startup_prewarm::SessionStartupPrewarmResolution",
  "codex_core::compact_remote_v2_attempt::RemoteCompactV2Attempt",
]
severity = "deny"
remediation = "Keep ModelClientSession local to one turn, or explicitly review and add a one-shot lifecycle owner."

# Raw provider account scope may be used transiently to derive the cache
# identity, but it must not cross a resolved logging or persistence boundary.
[[semantic-effect-policy.sensitive-sinks]]
id = "kd4-provider-account-scope-nonescape"
source-adts = ["codex_model_provider::auth::ProviderAccountScope"]
source-fields = [
  "codex_model_provider::auth::ProviderAccountScope::auth_mode",
  "codex_model_provider::auth::ProviderAccountScope::account_id",
  "codex_model_provider::auth::ProviderAccountScope::chatgpt_user_id",
  "codex_model_provider::auth::ProviderAccountScope::account_plan_type",
  "codex_model_provider::auth::ProviderAccountScope::workspace_account",
  "codex_model_provider::auth::ProviderAccountScope::fedramp_header",
  "codex_model_provider::auth::ProviderAccountScope::credential_scope_digest",
]
sink-callables = ["std::fs::write"]
sink-macro-crates = ["tracing"]
declassifier-callables = [
  "codex_model_provider::auth::provider_cache_auth_identity",
  "codex_model_provider::auth::credential_scope_digest",
  "codex_model_provider::auth::credential_scope_digest_for_headers",
]
severity = "deny"
message = "raw ProviderAccountScope material reaches a logging or persistence sink"
remediation = "Keep raw provider scope transient and emit only the reviewed digest or non-sensitive cache identity."

# Trace recording is observational. Calls resolved to the rollout-trace crate
# may not decide control flow, propagate failure, become runtime failure, or
# panic in the runtime crates that consume it.
[[semantic-effect-policy.noninterference]]
id = "kd4-rollout-trace-runtime-noninterference"
source-callables = [
  "codex_rollout_trace::writer::TraceWriter::create",
  "codex_rollout_trace::writer::TraceWriter::write_json_payload",
  "codex_rollout_trace::writer::TraceWriter::append",
  "codex_rollout_trace::writer::TraceWriter::append_with_context",
]
within-crates = ["codex_core", "codex_model_provider"]
severity = "deny"
message = "a rollout-trace result can affect model, tool, or runtime behavior"
remediation = "Handle rollout tracing as best-effort observation and keep its failures outside runtime control and result paths."

# A durable plan update is a transaction: cancellation is checked before the
# commit, and the commit dominates both publication and successful return.
[[semantic-effect-policy.ordering]]
id = "kd4-plan-cancellation-before-commit"
within-callable = "codex_core::tools::handlers::plan::PlanHandler::handle_call"
prerequisite-callables = ["tokio_util::sync::cancellation_token::CancellationToken::is_cancelled"]
dependent-callables = ["codex_core::task_evidence::TaskEvidenceLedger::record_planning_update"]
unknown-behavior = "diagnose"
severity = "deny"
message = "the durable plan commit is reachable without a dominating cancellation check"
remediation = "Check the invocation cancellation token on every path before recording the plan update."

[[semantic-effect-policy.ordering]]
id = "kd4-plan-commit-before-publish"
within-callable = "codex_core::tools::handlers::plan::PlanHandler::handle_call"
prerequisite-callables = ["codex_core::task_evidence::TaskEvidenceLedger::record_planning_update"]
dependent-callables = ["codex_core::session::session::Session::send_event"]
unknown-behavior = "diagnose"
severity = "deny"
message = "a plan update event can be published before the durable plan commit"
remediation = "Record the authoritative plan update before publishing EventMsg::PlanUpdate."

[[semantic-effect-policy.ordering]]
id = "kd4-plan-commit-before-success"
within-callable = "codex_core::tools::handlers::plan::PlanHandler::handle_call"
prerequisite-callables = ["codex_core::task_evidence::TaskEvidenceLedger::record_planning_update"]
dependent-callables = ["codex_core::tools::context::boxed_tool_output"]
unknown-behavior = "diagnose"
severity = "deny"
message = "the plan tool can report success before the durable plan commit"
remediation = "Make every successful tool-result path pass through record_planning_update first."

# A blocked authoritative wait is nonterminal and must never be translated to
# the terminal surfaced-result vocabulary.
[[semantic-type-policy.forbidden-variant-construction]]
id = "kd4-blocked-wait-remains-nonterminal"
source-variant = "codex_core::session::reasoning_governor::AuthoritativeWaitResolution::Blocked"
target-adt = "codex_protocol::protocol::SurfacedToolResult"
severity = "deny"
remediation = "Keep Blocked on the nonterminal wait path; construct SurfacedToolResult only from a terminal resolution."

# A tool implementation must be reached through the registry-owned dispatch
# boundary. Direct handler invocation is valid Rust but bypasses lifecycle,
# telemetry, projection, and terminal-outcome behavior owned by the registry.
[[required-mediation]]
id = "tool-handler-execution-through-registry"
entrypoints = ["codex_core::tools::router::ToolRouter::dispatch_tool_call_with_terminal_outcome"]
effect = "codex_core::tools::registry::handle_any_tool"
mediators = ["codex_core::tools::registry::ToolRegistry::dispatch_any_with_terminal_outcome"]
severity = "deny"

# Lifecycle contributors are observers. The contributor trait itself says
# implementations must not inspect, rewrite, or own tool execution.
[[trait-effect-envelope]]
id = "tool-lifecycle-contributors-remain-observers"
trait = "codex_extension_api::contributors::ToolLifecycleContributor"
role = "observer"
effect = [
  { selector = "codex_core::tools::registry::ToolRegistry::dispatch_any_with_terminal_outcome", disposition = "must-not-reach" },
  { selector = "codex_core::tools::registry::handle_any_tool", disposition = "must-not-reach" },
]
severity = "deny"

# The concrete permission profile and the named active-profile identity are
# resolved as one unit. Supplying same-typed values from different resolution
# roots compiles but misrepresents the active permission state.
[[co-provenance]]
id = "active-permission-profile-resolution"
severity = "deny"
[co-provenance.sink]
kind = "function"
function = "codex_core::config::resolved_permission_profile::PermissionProfileSnapshot::active"
arguments = [0, 1]

# ModelClient is session-scoped; ModelClientSession is turn-scoped and carries
# sticky routing state that must never escape into the longer-lived client.
[[lifetime-scope]]
id = "model-client-session-lifetime"
scopes = [
  { name = "turn", rank = 1, types = ["codex_core::client::ModelClientSession"] },
  { name = "session", rank = 2, types = ["codex_core::client::ModelClient"] },
]
severity = "deny"

# The registry is a generic runtime hub. Code-mode-specific policy belongs to
# the code-mode runtime/handler abstraction, even though the registry can
# legally branch on ToolCallSource today. Keep this warning visible as existing
# ownership debt while preventing new specializations from going unnoticed.
[[generic-hub]]
id = "tool-registry-remains-generic"
hubs = ["codex_core::tools::registry::ToolRegistry::dispatch_any_with_terminal_outcome"]
specializations = [
  { owner = "codex_core::tools::code_mode::CodeModeService", variants = ["codex_core::tools::context::ToolCallSource::CodeMode"] },
]
severity = "warn"

# Extension producers may add EventMsg variants that compile but are silently
# swallowed by the app-server host's wildcard arm.
[[variant-flow]]
id = "extension-event-host-disposition"
kind = "extension-event"
enum-path = "codex_protocol::protocol::EventMsg"
subject = "constructed"
producer-paths = ["ext/*/src/*.rs", "ext/*/src/**/*.rs"]
stages = [{ name = "app-server-host", path-patterns = ["app-server/src/extensions.rs"], function-patterns = ["*AppServerExtensionEventSink*::emit"], required-disposition = "explicit" }]

# Turn-context fields that reconstruct the active rollout segment must keep
# their live producer, persisted wire form, and replay consumer connected.
[[persistence-continuity]]
id = "turn-context-rollout-reconstruction"
field-patterns = [
  "codex_protocol::protocol::TurnContextItem::turn_id",
  "codex_protocol::protocol::TurnContextItem::model",
  "codex_protocol::protocol::TurnContextItem::comp_hash",
  "codex_protocol::protocol::TurnContextItem::realtime_active",
  "codex_protocol::protocol::TurnContextItem::context_provenance",
]
stages = [
  { name = "live", path-patterns = ["core/src/**"], required-evidence = "producer" },
  { name = "persist", path-patterns = ["protocol/src/protocol.rs"], required-evidence = "consumer", evidence-kinds = ["external_serialize"] },
  { name = "replay", path-patterns = ["core/src/session/rollout_reconstruction.rs"], required-evidence = "consumer" },
]

# Settings restored from rollout history must remain wired from live context
# construction through serialization into the resume reducer.
[[persistence-continuity]]
id = "turn-context-resumed-settings"
field-patterns = [
  "codex_protocol::protocol::TurnContextItem::cwd",
  "codex_protocol::protocol::TurnContextItem::workspace_roots",
  "codex_protocol::protocol::TurnContextItem::approval_policy",
  "codex_protocol::protocol::TurnContextItem::approvals_reviewer",
  "codex_protocol::protocol::TurnContextItem::sandbox_policy",
  "codex_protocol::protocol::TurnContextItem::permission_profile",
  "codex_protocol::protocol::TurnContextItem::model",
  "codex_protocol::protocol::TurnContextItem::personality",
  "codex_protocol::protocol::TurnContextItem::collaboration_mode",
  "codex_protocol::protocol::TurnContextItem::effort",
]
stages = [
  { name = "live", path-patterns = ["core/src/session/turn_context.rs"], required-evidence = "producer" },
  { name = "persist", path-patterns = ["protocol/src/protocol.rs"], required-evidence = "consumer", evidence-kinds = ["external_serialize"] },
  { name = "resume", path-patterns = ["protocol/src/persisted_thread_settings.rs"], required-evidence = "consumer" },
]

# Public boundary crates own their wire/API vocabulary. Implementation types
# may be dependencies, but must not escape through these public signatures.
[[public-boundary]]
id = "extension-api-does-not-leak-host"
crates = "codex_extension_api"
forbid-public-types-from = ["codex_core", "codex_app_server"]
severity = "deny"

[[public-boundary]]
id = "core-protocol-ownership"
crates = "codex_protocol"
forbid-public-types-from = ["codex_core", "codex_app_server", "codex_app_server_protocol", "codex_extension_api"]
severity = "deny"

[[public-boundary]]
id = "app-server-protocol-ownership"
crates = "codex_app_server_protocol"
forbid-public-types-from = ["codex_core", "codex_app_server", "codex_extension_api"]
severity = "deny"

[[public-boundary]]
id = "tools-api-does-not-leak-core"
crates = "codex_tools"
forbid-public-types-from = ["codex_core", "codex_app_server"]
severity = "deny"
