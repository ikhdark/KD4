version = 1

# Autonomous changes are admitted only when every changed path resolves through
# the repository's generated ownership index and all declared consequences have
# current, source-bound proof.
change-proof-receipts = ".kda/change-proofs.json"

[architecture-gate]
enabled = true
base-ref = "HEAD"
index = "../architecture_index.json"
proof-receipt = ".kda/architecture-closure.json"
select-profiles = true

# Protocol and app-server wire changes need exact-package validation, not a
# command string that could select the wrong target or zero tests.
[[change-consequence]]
id = "codex-protocol-wire-change"
subject-patterns = ["codex_protocol::*"]
downstream-contracts = ["rollout compatibility", "app-server consumers", "resume and replay"]
required-proofs = [
  { id = "codex-protocol-focused", command = "just test-fast -p codex-protocol", argv = ["just", "test-fast", "-p", "codex-protocol"], cwd = ".", minimum-selected-test-count = 1, toolchain = "1.95.0" },
]

[[change-consequence]]
id = "app-server-protocol-wire-change"
subject-patterns = ["codex_app_server_protocol::*"]
downstream-contracts = ["generated schemas", "desktop client compatibility", "app-server dispatch"]
required-proofs = [
  { id = "app-server-protocol-focused", command = "just test-fast -p codex-app-server-protocol", argv = ["just", "test-fast", "-p", "codex-app-server-protocol"], cwd = ".", minimum-selected-test-count = 1, toolchain = "1.95.0" },
]

# Count caps and per-item truncation do not establish a workspace-wide memory
# bound. These names mirror the retained command-output implementation.
[[retained-budget]]
name = "command-output-artifact-retention"
per-item-bound-terms = ["max_retained_artifact_bytes_per_thread", "max_output_bytes", "max_artifact_bytes", ".truncate("]
retention-operations = [".push(", ".push_back(", ".insert(", ".entry("]
aggregate-byte-terms = ["max_retained_artifact_bytes_total", "total_bytes", "global_bytes", "retained_bytes", "byte_budget"]
cardinality-terms = ["max_retained_artifacts_total", "max_retained_artifacts_per_thread", "max_entries", ".len() >="]

# Summed child work is not elapsed time when the children overlap.
[[elapsed-topology]]
name = "parallel-child-latency"
parallel-terms = ["join_all", "futuresunordered", "joinset", "parallel", "concurrent"]
duration-terms = ["elapsed", "duration", "wall_time", "latency"]
sum-terms = [".sum", "fold(", "saturating_add("]
interval-terms = ["started_at", "finished_at", "critical_path", "union_duration", "attributed_client_union"]

# Every production CoreToolRuntime must reach both router construction and the
# terminal-outcome dispatcher. Implementations compile even when they are
# omitted from the runtime plan, so registration is a deny-level contract.
[[registration-check]]
id = "core-tool-runtime-registration"
candidate-traits = ["codex_core::tools::registry::CoreToolRuntime"]
registration-calls = [
  { selector = "codex_core::tools::spec_plan::PlannedTools::add", component-argument = 0 },
  { selector = "codex_core::tools::spec_plan::PlannedTools::add_with_exposure", component-argument = 0 },
  { selector = "codex_core::tools::spec_plan::PlannedTools::add_dispatch_only", component-argument = 0 },
  { selector = "codex_core::tools::spec_plan::PlannedTools::add_arc", component-argument = 0 },
]
dispatchers = ["codex_core::tools::registry::ToolRegistry::dispatch_any_with_terminal_outcome"]
entrypoints = [{ id = "core-tool-runtime", roots = ["codex_core::tools::spec_plan::build_tool_router", "codex_core::tools::router::ToolRouter::dispatch_tool_call_with_terminal_outcome"] }]
coverage = "every-entrypoint"
exclude-targets = ["test", "bench", "example", "build-script"]
ignore = [{ component = "codex_core::tools::registry::ExposureOverride", reason = "internal decorator created inside the registration helper" }]
severity = "deny"

# Each extension facet is independently discoverable. A type implementing a
# facet must be installed into the app-server host exactly once.
[[registration-check]]
id = "extension-approval-review-registration"
candidate-traits = ["codex_extension_api::contributors::ApprovalReviewContributor"]
registration-calls = [{ selector = "codex_extension_api::registry::ExtensionRegistryBuilder::approval_review_contributor", component-argument = 0 }]
entrypoints = [{ id = "app-server-extensions", roots = ["codex_app_server::extensions::thread_extensions"] }]
coverage = "exactly-once-per-entrypoint"
exclude-targets = ["test", "bench", "example", "build-script"]
severity = "deny"

