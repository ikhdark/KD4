# Agent workflow: run commands from this Cargo workspace, not the Git root.
# Check analyzer freshness with KDA_ANALYZER_CHECKOUT_ROOT set to the KDA
# checkout, then: cargo kda op --root . --json '{"op":"status"}'
# Discover operations/schema with catalog; do not invent contracts or tool IDs.
# Diagnose: cargo kda op --root . --json '{"op":"gate","execute_workspace":true}'
# Review: cargo kda op --root . --json '{"op":"review","base":"HEAD"}'
# Follow returned next_calls and artifact IDs for retained evidence, witnesses,
# consumers, unknown boundaries, and authorized evidence plans before making repairs.
# Apply only reviewed, revision-matching edits. Verify the observable behavior
# with permitted owning-path evidence, then rerun only authorized checks invalidated by the changes.
# A partial report or an unresolved obligation is not a clean gate or repair
# authority. Preserve existing user edits; never activate Desktop as a side effect.
version = 1

# Reuse KDA's exact KD4 runtime contracts instead of duplicating guessed symbols.
policy-pack = ["kd4@1"]
exclude = ["target/**", "target-*/**", ".kda/**"]

# Security review is out of scope, including security checks that default to deny.
# Keep unrelated correctness, reliability, and data-integrity checks enabled.
[lints]
authority-lattice-widening = "allow"
authority-membership-identity-drift = "allow"
authorization-envelope-drift = "allow"
authorization-subject-drift = "allow"
await-holding-guard = "warn"
capability-flow-unproven = "allow"
capability-lifecycle-violation = "allow"
capability-mediation-bypass = "allow"
capability-origin-violation = "allow"
capability-scope-escape = "allow"
capability-subject-mismatch = "allow"
command-injection = "allow"
denied-read-unsandboxed-execution = "allow"
expect-in-library = "warn"
fail-open-policy-fallback = "allow"
hardcoded-credential = "allow"
insecure-tls-verification = "allow"
kd4-permission-keyed-transaction = "allow"
kd4-provider-account-scope-escape = "allow"
nominal-authority-without-membership = "allow"
non-fail-closed-shell-classifier = "allow"
non-inheritable-child-environment = "allow"
non-inheritable-context-escape = "allow"
path-injection = "allow"
permission-grant-continuity = "allow"
permission-profile-widening = "allow"
powershell-method-assumed-read-only = "allow"
privileged-effect-without-authority = "allow"
privileged-effect-without-guard = "allow"
redaction-not-dominating-boundary = "allow"
retry-context-drift = "allow"
secret-to-log = "allow"
security-context-drop = "allow"
security-context-relaxation = "allow"
security-policy-monotonicity = "allow"
security-recognizer-normalization-drift = "allow"
sensitive-data-escape = "allow"
trust-sensitive-view-escape = "allow"
unbound-capability-token = "allow"
uncovered-privileged-sink = "allow"
unfiltered-sandbox-capability-root = "allow"
unsafe-powershell-approval-parser = "allow"
wrong-scope-authority = "allow"

# Keep every other built-in severity, including denials and uncertainty diagnostics.
# Analyze the supported Windows host with normal Cargo default features.
# Trusted loading enables build scripts/proc macros and compiler preflight;
# agent gate operations must also explicitly set execute_workspace=true.
[[analysis-profile]]
name = "windows-default"
target = "x86_64-pc-windows-msvc"
workspace-execution = "trusted"
