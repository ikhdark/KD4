[package]
name = "codex-network-proxy"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "codex_network_proxy"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
chrono = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-der = { workspace = true }
codex-utils-home-dir = { workspace = true }
codex-utils-rustls-provider = { workspace = true }
globset = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
url = { workspace = true }
rama-core = { workspace = true }
rama-http = { workspace = true }
rama-http-backend = { workspace = true, features = ["tls"] }
rama-net = { workspace = true, features = ["http", "tls"] }
rama-socks5 = { workspace = true }
rama-tcp = { workspace = true, features = ["http"] }
rama-tls-rustls = { workspace = true, features = ["http"] }
rustls-native-certs = { workspace = true }
sha2 = { workspace = true }
schannel = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
