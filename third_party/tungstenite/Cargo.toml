# KD4 production-only vendor of upstream revision 4fffad30fe373adbdcffab9545e9e9bf4f2fc19f.
[package]
name = "tungstenite"
description = "Lightweight stream-based WebSocket implementation"
categories = ["web-programming::websocket", "network-programming"]
keywords = ["websocket", "io", "web"]
authors = ["Alexey Galakhov", "Daniel Abramov"]
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/snapview/tungstenite-rs"
documentation = "https://docs.rs/tungstenite/0.27.0"
repository = "https://github.com/openai-oss-forks/tungstenite-rs"
version = "0.27.0"
edition = "2021"
rust-version = "1.75"
autotests = false
autobenches = false
autoexamples = false
include = ["src/**/*", "LICENSE-*", "README.md"]

[lib]
test = false
doctest = false
bench = false

[package.metadata.docs.rs]
all-features = true

# Keep upstream source byte-identical: its `std::usize` uses are deprecated
# aliases of `usize::MAX`, so do not report them in local builds.
[lints.rust]
deprecated = "allow"

[features]
default = ["handshake"]
handshake = ["data-encoding", "headers", "httparse", "sha1"]
headers = ["http", "dep:headers"]
proxy = ["handshake"]
url = ["dep:url"]
native-tls = ["native-tls-crate"]
native-tls-vendored = ["native-tls", "native-tls-crate/vendored"]
rustls-tls-native-roots = ["__rustls-tls", "rustls-native-certs"]
rustls-tls-webpki-roots = ["__rustls-tls", "webpki-roots"]
__rustls-tls = ["rustls", "rustls-pki-types"]
deflate = ["headers", "flate2"]

[dependencies]
data-encoding = { version = "2.11.1", optional = true }
bytes = "1.12.1"
headers = { version = "0.4.2", optional = true }
http = { version = "1.5.0", optional = true }
httparse = { version = "1.10.1", optional = true }
log = "0.4.35"
rand = "0.9.5"
sha1 = { version = "0.10.7", optional = true }
thiserror = "2.0.21"
url = { version = "2.5.8", optional = true }
utf-8 = "0.7.6"

[dependencies.flate2]
optional = true
version = "1.1.10"
default-features = false
# Preserve the pinned fork's wasm-compatible context-window backend.
features = ["zlib-rs"]

[dependencies.native-tls-crate]
optional = true
package = "native-tls"
version = "0.2.18"

[dependencies.rustls]
optional = true
default-features = false
features = ["std"]
version = "0.23.46"

[dependencies.rustls-pki-types]
optional = true
version = "1.15.1"

[dependencies.rustls-native-certs]
optional = true
version = "0.8.5"

[dependencies.webpki-roots]
optional = true
version = "0.26.11"
